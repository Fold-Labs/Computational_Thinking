<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>What is Computational Thinking?</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/h5p-standalone@3.8.0/dist/styles/h5p.css">

<script src="https://cdn.jsdelivr.net/npm/h5p-standalone@3.8.0/dist/main.bundle.js"></script>

<style>

body{
font-family:Arial,sans-serif;
margin:0;
background:#f5f5f5;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
}

#lessons{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:15px;
padding:20px;
}

.lesson{
background:white;
padding:20px;
border-radius:10px;
cursor:pointer;
box-shadow:0 2px 6px rgba(0,0,0,.15);
}

#viewer{
padding:20px;
}

</style>

</head>

<body>

<header>
<h1>Learning Portal</h1>
</header>

<div id="lessons"></div>

<div id="viewer"></div>

<script>

fetch("lessons.json")
.then(res=>res.json())
.then(data=>{

const lessonList =
document.getElementById("lessons");

data.forEach(lesson=>{

const card =
document.createElement("div");

card.className = "lesson";

card.innerHTML = lesson.title;

card.onclick = ()=>{

document.getElementById("viewer")
.innerHTML = "";

new H5PStandalone.H5P(
document.getElementById("viewer"),
{
h5pJsonPath: lesson.folder
}
);

};

lessonList.appendChild(card);

});

});

</script>

</body>
</html>
